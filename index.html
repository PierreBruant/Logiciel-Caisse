:root[data-theme="dark"]{--bg:#15191a;--card:#1f2527;--ink:#eceae4;--mut:#9aa4a0;--line:#33393b;--g:#2f8f74;--r:#d4604e;--c1:#4a3a18;--c2:#46431a;--c3:#1f3a2e;--c4:#33312c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
header button{border:0;background:none;color:var(--mut);font:600 18px system-ui,-apple-system,sans-serif;padding:10px 18px;border-radius:12px}

.pos{flex:1;min-height:0;display:flex}
.grid{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,150px);justify-content:center;gap:10px;align-content:start;grid-auto-rows:148px}

.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.c5{background:var(--c3)}

.lk{border:0;background:none;color:var(--r);font:600 15px system-ui,-apple-system,sans-serif;padding:8px}
.ls{flex:1;overflow:auto;padding:4px 10px}
.ln{display:grid;grid-template-columns:1fr auto 70px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.q{display:flex;align-items:center;gap:8px}

.am{text-align:right;font-weight:600}

s+="SAISIE LIBRE\nProduits du bar\n"+L(G.bar,([n,o])=>n+" : "+o.q)+"\n\nRetours de consigne\n"+L(G.ret,([n,o])=>n+" : "+o.q)+"\n\nRemises\nTotal remises HT : "+F(R.rm/1.2)+"\nTotal remises TTC : "+F(R.rm)+"\n";
s+="\nFÛTS PERCUTÉS\n"+L(kegR(),([n,c])=>n+" : "+c)+"\n";
return s}
let A=[];try{A=JSON.parse(localStorage.getItem("caisse-arch-v1")||"[]")}catch(e){}
const saveA=()=>{try{localStorage.setItem("caisse-arch-v1",JSON.stringify(A))}catch(e){}};
function arch(){
$("#main").innerHTML=`<div class="rc"><h3>Récaps clôturés</h3>${A.slice().reverse().map(a=>`<div class="tc"><div class="tr"><b>${frd(a.date)}</b><span>clôturé le ${a.at}</span><b>${fmt(a.tot)}</b></div><div class="tl"><span>${a.n} ticket(s) encaissé(s)</span></div><details><summary>Voir le récap</summary><textarea readonly>${a.text}</textarea></details><div class="act"><button class="btn" data-ac="${a.id}">Copier le texte</button><button class="btn o" data-ar="${a.id}">${armed==="ar"+a.id?"Confirmer ?":"Rouvrir cette journée"}</button><button class="btn d" data-ad="${a.id}">${armed==="ad"+a.id?"Confirmer ?":"Supprimer"}</button></div></div>`).join("")||"<div>Aucun récap clôturé pour l’instant. Utilisez « Clôturer la session » dans l’onglet Récap de session.</div>"}</div>`}
function rec(){const R=recap(),pr=Object.entries(R.pr).sort((a,b)=>b[1].a-a[1].a),ds=Object.entries(R.ds),tv=Object.entries(R.tv).sort((a,b)=>a[0]-b[0]);
$("#main").innerHTML=`<div class="rc">${dbar()}<div class="stats"><div class="st"><span>Tickets</span><b>${R.n}</b></div><div class="st"><span>CB</span><b>${fmt(R.cb)}</b></div><div class="st"><span>Espèces</span><b>${fmt(R.es)}</b></div><div class="st"><span>Total encaissé</span><b>${fmt(R.tot)}</b></div><div class="st"><span>Total remises TTC</span><b>−${fmt(R.rm)}</b><span>HT : −${fmt(R.rm/1.2)}</span></div></div>
<h3>Ventes par produit</h3><table><tr><th>Produit (prix plein)</th><th>Qté</th><th>Montant avant remises</th></tr>${pr.map(([n,o])=>`<tr><td>${n}</td><td>${o.q}</td><td>${fmt(o.a)}</td></tr>`).join("")||"<tr><td>Aucune vente</td><td></td><td></td></tr>"}</table>
<h3>Remises</h3><table><tr><th>Remise</th><th>Nombre</th><th>HT</th><th>TTC</th></tr>${ds.map(([n,o])=>`<tr><td>${n}</td><td>${o.c}</td><td>−${fmt(o.a/1.2)}</td><td>−${fmt(o.a)}</td></tr>`).join("")||"<tr><td>Aucune remise</td><td></td><td></td><td></td></tr>"}${ds.length?`<tr><td><b>Total remises à reporter sur la facture</b></td><td></td><td><b>−${fmt(R.rm/1.2)}</b></td><td><b>−${fmt(R.rm)}</b></td></tr>`:""}</table>
<h3>TVA (remises comptées à 20 %)</h3><table><tr><th>Taux</th><th>HT</th><th>TVA</th><th>TTC</th></tr>${tv.map(([v,a])=>`<tr><td>${v} %</td><td>${fmt(a/(1+v/100))}</td><td>${fmt(a-a/(1+v/100))}</td><td>${fmt(a)}</td></tr>`).join("")||"<tr><td>Aucune vente</td><td></td><td></td><td></td></tr>"}</table>
<h3>Fûts percutés</h3><table><tr><th>Fût</th><th>Nombre</th></tr>${kegR().map(([n,c])=>`<tr><td>${n}</td><td>${c}</td></tr>`).join("")||"<tr><td>Aucun fût noté</td><td></td></tr>"}</table>
<div class="act"><button class="btn" data-a="copy">Copier l’export .txt</button><button class="btn d" data-a="close">${armed==="close"?"Confirmer la clôture ?":"Clôturer la session"}</button></div>
<textarea id="ta" readonly>${report()}</textarea></div>`}
function his(){if(RA)RD=today();const L=S.t.filter(t=>td(t)===RD).reverse();
$("#main").innerHTML=`<div class="rc">${dbar()}<div>${L.length} ticket(s), du plus récent au plus ancien</div>${L.map(t=>`<div class="tc${t.x?" cx":""}"><div class="tr"><b>Ticket ${t.id}</b><span>${t.h||""}</span><span>${t.pay}</span><b>${fmt(t.tot)}</b></div>${t.l.map(l=>`<div class="tl"><span>${l.q} × ${l.n}</span><span>${fmt(l.q*l.p)}</span></div>`).join("")}${t.d.map(d=>`<div class="tl"><span>${d.l}</span><span>−${fmt(d.a)}</span></div>`).join("")}${t.x?`<div class="tl"><b>Ticket annulé</b></div>`:`<button class="btn o" data-c="${t.id}">${armed==="c"+t.id?"Confirmer l’annulation ?":"Annuler ce ticket"}</button>`}</div>`).join("")||"<div>Aucun ticket</div>"}</div>`}
const CT=["","Pression","Softs","Bouteilles 33 cl","Consignes / divers","Bouteilles 75 cl"],TV=[5.5,10,20],tvO=f=>TV.map(v=>`<option value="${v}"${v==f?" selected":""}>TVA ${v} %</option>`).join(""),caO=f=>[1,2,3,5,4].map(c=>`<option value="${c}"${c==f?" selected":""}>${CT[c]}</option>`).join(""),moO=f=>[["b","Bar"],["m","Marché"],["bm","Les deux"]].map(x=>`<option value="${x[0]}"${x[0]==f?" selected":""}>${x[1]}</option>`).join("");
const imO=f=>`<option value="">Image auto</option>`+Object.keys(IM).map(k=>`<option value="${k}"${k===f?" selected":""}>${k}</option>`).join("");
const derive=async p=>{if(!(p[2]===3||/33\s*cl/i.test(p[0])))return false;let src="";const ch=p[5]&&IM[p[5]]?p[5]:"";
if(ch){if(!/75\s*cl/i.test(ch))return false;src=IM[ch]}else{if(imOf(p[0]))return false;src=imOf(p[0].replace(/33(\s*cl)/i,"75$1"))}
if(!src)return false;
const im=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=src}),c=document.createElement("canvas");c.width=300;c.height=200;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,300,200);const w=156,h=w*im.height/im.width;x.drawImage(im,(300-w)/2,(200-h)/2+6,w,h);
const k="📷 "+p[0];IM[k]=c.toDataURL("image/jpeg",.85);p[5]=k;saveI();saveP();return true};
const deriveAll=async()=>{let ch=false;for(const p of P){try{if(await derive(p))ch=true}catch(e){}}if(ch&&(V==="pos"||V==="prod"))shell()};
let NPF=null;
function pick(cb){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="ovb"><div class="ovh"><b>Choisir une icône</b><button class="btn" data-cl="1">Fermer</button></div><div class="ovg"><label class="ovf">📁 Depuis l’iPad<input type="file" accept="image/*" hidden></label>${Object.keys(IM).map(k=>`<button data-k="${k.replace(/"/g,"&quot;")}"><img src="${IM[k]}" alt=""><span>${k}</span></button>`).join("")}</div></div>`;
o.addEventListener("click",e=>{e.stopPropagation();if(e.target===o||e.target.closest("[data-cl]")){o.remove();return}const b=e.target.closest("[data-k]");if(b){o.remove();cb({key:b.dataset.k})}});
o.querySelector("input").addEventListener("change",e=>{const f=e.target.files[0];if(f){o.remove();cb({file:f})}});document.body.appendChild(o)}
function prod(){
$("#main").innerHTML=`<div class="rc"><h3>Nouveau produit</h3><div class="pr2"><input id="nn" placeholder="Nom du produit"><input id="npp" inputmode="decimal" placeholder="Prix TTC"><select id="nv">${tvO(20)}</select><select id="nc">${caO(1)}</select><select id="nm">${moO("b")}</select><select id="ni">${imO("")}</select><button class="btn o nfl" data-a="pk">🖼 Choisir une icône</button><button class="btn" data-a="addp">Ajouter</button></div><h3>Produits existants</h3>${P.map((p,i)=>`<div class="pr2${p[6]===false?" off":""}"><input data-f="0" data-i="${i}" value="${p[0]}"><input data-f="1" data-i="${i}" inputmode="decimal" value="${String(p[1]).replace(".",",")}"><select data-f="3" data-i="${i}">${tvO(p[3])}</select><select data-f="2" data-i="${i}">${caO(p[2])}</select><select data-f="4" data-i="${i}">${moO(p[4])}</select><select data-f="5" data-i="${i}">${imO(p[5])}</select><button class="btn o" data-pk="${i}">🖼</button><button class="btn ${p[6]===false?"":"o "}tg" data-tg="${i}">${p[6]===false?"Inactif":"Actif"}</button><button class="btn d" data-dp="${i}">${armed==="dp"+i?"Confirmer ?":"Supprimer"}</button></div>`).join("")}</div>`}
const rsz=file=>new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const im=new Image();im.onerror=ko;im.onload=()=>{const W=300,H=200,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);const k=Math.min(W/im.width,H/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);ok(c.toDataURL("image/jpeg",.8))};im.src=r.result};r.readAsDataURL(file)});
const addImg=async(file,name)=>{const k="📷 "+name;IM[k]=await rsz(file);saveI();return k};
document.addEventListener("change",async e=>{const t=e.target,d=t.dataset;
if(t.id==="nf"){const l=t.closest("label");if(l&&l.firstChild)l.firstChild.textContent=t.files[0]?"✅ "+t.files[0].name.slice(0,18)+" ":"📷 Choisir une image";return}

if(d.ph!=null&&t.files&&t.files[0]){try{const i=+d.ph;P[i][5]=await addImg(t.files[0],P[i][0]);saveP();prod();toast("Photo enregistrée")}catch(x){toast("Photo illisible")}return}
if(t.id==="rdi"){if(t.value){RD=t.value;RA=RD===today();rd()}return}if(d.f==null)return;const i=+d.i,f=+d.f;
if(f===0){const n=t.value.replace(/[<>&"]/g,"").trim();if(n)P[i][0]=n;t.value=P[i][0];derive(P[i]).then(r=>{if(r)prod()}).catch(()=>0)}
else if(f===1){const x=parseFloat(t.value.replace(",","."));if(!isNaN(x))P[i][1]=Math.round(x*100)/100;t.value=String(P[i][1]).replace(".",",")}
else P[i][f]=f>=4?t.value:+t.value;
if(f===5||f===2)derive(P[i]).then(r=>{if(r){saveP();prod()}}).catch(()=>0);
saveP();toast("Enregistré")});
const rd=()=>V==="his"?his():V==="prod"?prod():V==="arc"?arch():V==="rec"?rec():0;
const keep=f=>{const s=document.querySelector(".rc"),y=s?s.scrollTop:0,w=window.scrollY;f();const n=document.querySelector(".rc");if(n)n.scrollTop=y;window.scrollTo(0,w)};
function arm(k,fn){keep(()=>{if(armed===k){armed="";fn()}else{armed=k;toast("Appuyez à nouveau pour confirmer");setTimeout(()=>{if(armed===k){armed="";keep(rd)}},5000)}rd()})}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
if(d.tab){V=d.tab;armed="";shell()}
else if(d.md){const o=Object.assign({},M);o[d.md]=!o[d.md];if(d.md!=="f"&&!o.b&&!o.m){toast("Gardez au moins un mode actif");return}M=o;try{localStorage.setItem("caisse-modes-v1",JSON.stringify(M))}catch(e){}mdUpd();if(V==="pos")pos()}
else if(d.rd){RA=d.rd==="t";RD=RA?today():yest();rd()}
else if(d.tg!=null){const i=+d.tg;P[i][6]=P[i][6]===false;saveP();keep(prod);toast(P[i][6]===false?"Produit masqué de la caisse":"Produit actif")}
else if(d.a==="pk"){pick(r=>{if(r.key){NPF=null;$("#ni").value=r.key}else{NPF=r.file;$("#ni").value=""}t.textContent="✅ "+(r.key||r.file.name).slice(0,16)})}
else if(d.pk!=null){const i=+d.pk;pick(async r=>{try{P[i][5]=r.key||await addImg(r.file,P[i][0]);if(r.key)await derive(P[i]).catch(()=>0);saveP();prod();toast("Icône enregistrée")}catch(x){toast("Image illisible")}})}
else if(d.fu){const[k,v]=d.fu.split("|"),b=kegB()[+k];if(!b)return;kp(()=>S.f.push({id:Date.now(),n:b[0],v:+v,dt:today(),h:now()}));toast("Fût noté : "+b[0]+" "+v+" l")}
else if(d.fx){kp(()=>{S.f=S.f.filter(f=>String(f.id)!==d.fx)});toast("Fût retiré")}
else if(d.add!=null){C[d.add]=(C[d.add]||0)+1;upd()}
else if(d.p!=null){C[d.p]++;upd()}
else if(d.m!=null){C[d.m]--;if(C[d.m]<=0)delete C[d.m];upd()}
else if(d.pay){pay(d.pay)}
else if(d.d!=null){D.push(DO[d.d]);showD=false;upd()}
else if(d.x!=null){D.splice(d.x,1);upd()}
else if(d.a==="show"){showD=true;upd()}
else if(d.a==="hide"){showD=false;upd()}
else if(d.a==="clear"){C={};D=[];showD=false;upd()}
else if(d.a==="copy"){const ta=$("#ta");ta.select();try{navigator.clipboard.writeText(ta.value).then(()=>toast("Récap copié"),()=>toast("Sélectionné : copiez-le"))}catch(x){toast("Sélectionné : copiez-le")}}
else if(d.a==="undo"){arm("undo",()=>{const x=S.t.pop();save();rec();toast(x?"Ticket "+x.id+" annulé":"Aucun ticket")})}
else if(d.a==="addp"){const fl=NPF;const n=$("#nn").value.replace(/[<>&"]/g,"").trim(),x=parseFloat($("#npp").value.replace(",","."));if(!n||isNaN(x)){toast("Nom et prix requis");return}(async()=>{let im=$("#ni").value;if(fl){try{im=await addImg(fl,n)}catch(x){toast("Photo illisible")}}P.push([n,Math.round(x*100)/100,+$("#nc").value,+$("#nv").value,$("#nm").value,im]);NPF=null;saveP();await derive(P[P.length-1]).catch(()=>0);prod();toast("Produit ajouté")})()}
else if(d.dp!=null){arm("dp"+d.dp,()=>{P.splice(+d.dp,1);C={};D=[];saveP()})}
else if(d.c!=null){arm("c"+d.c,()=>{const x=S.t.find(t=>t.id==d.c);if(x){x.x=true;save();toast("Ticket "+x.id+" annulé")}})}
else if(d.a==="close"){arm("close",()=>{const T=S.t.filter(t=>td(t)===RD);const FT=S.f.filter(f=>f.dt===RD);if(!T.length&&!FT.length){toast("Aucun ticket ni fût à clôturer");return}const R=recap();A.push({id:Date.now(),date:RD,at:now(),n:R.n,tot:R.tot,text:report(),t:T,f:FT});saveA();S.t=S.t.filter(t=>td(t)!==RD);S.f=S.f.filter(f=>f.dt!==RD);save();toast("Session clôturée et archivée")})}
else if(d.ac){const a=A.find(x=>x.id==d.ac);try{navigator.clipboard.writeText(a.text).then(()=>toast("Récap copié"),()=>toast("Ouvrez le récap et copiez-le à la main"))}catch(x){toast("Ouvrez le récap et copiez-le à la main")}}
else if(d.ar){arm("ar"+d.ar,()=>{const a=A.find(x=>x.id==d.ar);if(!a)return;let m=S.t.reduce((x,t)=>Math.max(x,t.id),0);a.t.forEach(t=>{t.id=++m;S.t.push(t)});(a.f||[]).forEach(f=>S.f.push(f));A=A.filter(x=>x!==a);saveA();save();toast("Journée rouverte")})}
else if(d.ad){arm("ad"+d.ad,()=>{A=A.filter(x=>x.id!=d.ad);saveA();toast("Récap supprimé")})}});
mdUpd();shell();deriveAll();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
